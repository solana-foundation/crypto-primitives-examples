name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          install-solana: 'false'
          rust-cache-key: 'lint'

      - name: Generate and build TypeScript client
        run: |
          just generate-clients
          pnpm --filter @solana/crypto-primitives-client build

      - name: Check linting
        run: just lint-check
