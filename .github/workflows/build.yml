name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: '4.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: 'build'
          save-rust-cache: 'true'
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build program and clients
        run: just build

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          install-rust: 'false'
          install-solana: 'false'
          install-just: 'false'
          enable-rust-cache: 'false'

      - name: Build TypeScript client
        run: pnpm --filter @solana/crypto-primitives-client build

      - name: Build web app
        run: pnpm --filter @solana/crypto-primitives-web build
